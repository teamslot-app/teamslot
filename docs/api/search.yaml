openapi: 3.0.3
info:
  title: search-service
  version: 1.0.0
  description: |
    Recherche par proximité des terrains et des matchs aux places ouvertes (la carte, ADR-012).
    search-service ne possède aucune donnée maîtresse : il garde un index (geohash, DynamoDB) rempli
    par les événements venue.*, slot.*, match.* (docs/events.md). Il remplacera à terme
    GET /api/v1/venues (venue-service) et GET /api/v1/matches/open (match-service, SCRUM-118).
    Contrat sommaire (SCRUM-71), écrit à partir de l'ADR-012 et de docs/events.md.
    Conventions : préfixe /api/v1, erreurs Problem Details (RFC 9457), dates ISO 8601 UTC,
    montants en centimes avec la devise.
    Accès public (décision d'équipe, Sprint 3) : la carte est visible sans compte. La passerelle
    doit donc laisser passer /api/v1/search/** sans jeton.
    Sécurité :
    - plafonds contre l'aspiration de la base (scraping) : rayon ≤ 20 000 m, size ≤ 50,
      date au plus 30 jours après aujourd'hui ; au-delà, 400 ;
    - limitation de débit par client à la passerelle : au-delà, 429 ;
    - aucune donnée personnelle : ni gérant (ownerId), ni organisateur, ni participant ;
      seuls les matchs publics apparaissent ;
    - la position de l'utilisateur (lat, lon) est une donnée personnelle : le front l'arrondit à
      3 décimales (environ 100 m) avant l'appel, et les coordonnées ne doivent pas être écrites
      dans les logs (passerelle comprise).
    Fluidité :
    - réponses publiques mises en cache 30 s (Cache-Control: public, max-age=30) : la carte se
      réaffiche sans rappeler le serveur ; l'arrondi des coordonnées rend les recherches au même
      endroit identiques, donc le cache sert vraiment ;
    - l'index est rempli par événements Kafka, avec quelques secondes de décalage (cohérence à
      terme) : un match peut encore apparaître alors que sa dernière place vient d'être prise ;
      POST /api/v1/matches/{id}/join répond alors 409 no-open-spots et le front affiche « complet ».
servers:
  - url: http://localhost:8088
    description: Développement local (port à confirmer avec le service modèle)
security: []
tags:
  - name: search
    description: Recherche par proximité (publique)
paths:
  /api/v1/search/venues:
    get:
      tags: [search]
      summary: Terrains à proximité
      description: Du plus proche au plus éloigné. Accessible sans compte.
      operationId: searchVenues
      parameters:
        - { $ref: "#/components/parameters/Lat" }
        - { $ref: "#/components/parameters/Lon" }
        - { $ref: "#/components/parameters/Radius" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Une page de terrains
          headers:
            Cache-Control: { $ref: "#/components/headers/PublicShortCache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueResultPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/v1/search/matches/open:
    get:
      tags: [search]
      summary: Matchs à venir avec des places ouvertes, à proximité
      description: |
        Matchs publics, pas encore commencés, avec au moins une place ouverte, du plus proche
        au plus éloigné. Accessible sans compte ; pour demander une place, il faut un compte
        (POST /api/v1/matches/{id}/join, match-service). Index mis à jour avec quelques secondes de
        décalage : une place affichée peut déjà être prise (le join répond alors 409 no-open-spots).
      operationId: searchOpenMatches
      parameters:
        - { $ref: "#/components/parameters/Lat" }
        - { $ref: "#/components/parameters/Lon" }
        - { $ref: "#/components/parameters/Radius" }
        - name: date
          in: query
          required: false
          description: Jour recherché (ISO 8601, fuseau Africa/Casablanca), au plus 30 jours après aujourd'hui. Absent = les 7 prochains jours.
          schema: { type: string, format: date }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Size" }
      responses:
        "200":
          description: Une page de matchs
          headers:
            Cache-Control: { $ref: "#/components/headers/PublicShortCache" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpenMatchResultPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
components:
  parameters:
    Lat:
      name: lat
      in: query
      required: true
      description: Latitude arrondie à 3 décimales par le front (environ 100 m)
      schema: { type: number, format: double, minimum: -90, maximum: 90 }
    Lon:
      name: lon
      in: query
      required: true
      description: Longitude arrondie à 3 décimales par le front (environ 100 m)
      schema: { type: number, format: double, minimum: -180, maximum: 180 }
    Radius:
      name: radius
      in: query
      required: false
      description: Rayon de recherche en mètres (20 km au plus)
      schema: { type: integer, minimum: 1, maximum: 20000, default: 5000 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
  headers:
    PublicShortCache:
      description: Résultats publics, réutilisables 30 secondes
      schema: { type: string, example: "public, max-age=30" }
  responses:
    BadRequest:
      description: Requête invalide (position absente, rayon, size ou date hors limites)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    TooManyRequests:
      description: Trop de requêtes, réessayer plus tard
      headers:
        Retry-After:
          description: Nombre de secondes à attendre
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
  schemas:
    ProblemDetails:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: "https://teamslot.app/problems/radius-too-large" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    Money:
      type: object
      description: Montant en centimes avec sa devise
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 0, example: 15000 }
        currency: { type: string, minLength: 3, maxLength: 3, example: MAD }
    VenueResult:
      type: object
      description: Terrain trouvé, sans aucune information sur son gérant
      required: [venueId, name, latitude, longitude, distanceMeters, pricePerHour, acceptsOnSitePayment]
      properties:
        venueId: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        distanceMeters: { type: integer, minimum: 0 }
        pricePerHour: { $ref: "#/components/schemas/Money" }
        acceptsOnSitePayment: { type: boolean }
    OpenMatchResult:
      type: object
      description: Résumé public d'un match aux places ouvertes, sans organisateur ni participant
      required: [matchId, venueId, venueName, startsAt, openSpots, maxPlayers, distanceMeters]
      properties:
        matchId: { type: string, format: uuid }
        venueId: { type: string, format: uuid }
        venueName: { type: string }
        startsAt: { type: string, format: date-time, example: "2026-11-20T18:00:00Z" }
        openSpots: { type: integer, minimum: 1 }
        maxPlayers: { type: integer, minimum: 2 }
        distanceMeters: { type: integer, minimum: 0 }
    VenueResultPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/VenueResult" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
    OpenMatchResultPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/OpenMatchResult" }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
