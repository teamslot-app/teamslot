openapi: 3.0.3
info:
  title: identity-service
  version: 2.0.0
  description: |
    Comptes, authentification (JWT court + refresh révocable) et profil.
    v2 (SCRUM-131) : inscription avec e-mail, date de naissance et pays du téléphone ; e-mail vérifié par un
    code à 6 chiffres avant la première connexion.
    Migration : email, phoneCountry et birthDate sont encore facultatifs dans RegisterRequest, pour que
    apps/web (front actuel) et deploy/e2e continuent de marcher. Ils deviennent obligatoires avec SCRUM-132,
    quand le nouveau front (apps/teamslot) et l'E2E les envoient.
    Contrat issu de la conception (sections 4, 6.3 et 7.2).
    Conventions : préfixe /api/v1, erreurs Problem Details (RFC 9457), dates ISO 8601 UTC.
servers:
  - url: http://localhost:8083
    description: Développement local (port à confirmer avec le service modèle)
tags:
  - name: auth
    description: Inscription, connexion, renouvellement du jeton
  - name: users
    description: Profil de l'utilisateur connecté
  - name: keys
    description: Clés publiques de vérification des jetons (usage interne)
paths:
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Créer un compte
      description: |
        Crée un compte dont l'e-mail n'est pas encore vérifié, et publie user.registered puis
        identity.email_verification_requested (le code part par e-mail via notification-service).
        Le mot de passe est contrôlé ici, côté serveur, même si le front aide à le choisir :
        12 à 128 caractères, au moins 3 familles parmi minuscules, majuscules, chiffres et symboles,
        et il ne doit contenir ni l'e-mail, ni le nom affiché, ni le numéro.
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: |
            E-mail ou numéro déjà utilisé. Le message ne dit pas lequel des deux (type
            https://teamslot.app/problems/account-exists).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Se connecter
      description: |
        Un échec renvoie toujours 401, sans préciser si le téléphone ou le mot de passe est faux.
        Avec un mot de passe correct mais un e-mail pas encore vérifié : 403
        (type https://teamslot.app/problems/email-not-verified), pour que le front propose de saisir le code.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Jeton d'accès et jeton de renouvellement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: E-mail pas encore vérifié
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      summary: Vérifier l'e-mail avec le code reçu
      description: |
        Code à 6 chiffres, valable 15 minutes, à usage unique, 5 essais au plus. Erreurs (type) :
        invalid-code (400), code-expired (410), too-many-attempts (429). Un e-mail inconnu renvoie
        invalid-code, comme un mauvais code : la réponse ne dit pas si le compte existe.
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "204": { description: "E-mail vérifié, l'utilisateur peut se connecter" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "410":
          description: "Code expiré, en demander un nouveau"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
        "429":
          description: "Trop d'essais pour ce code, en demander un nouveau"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /api/v1/auth/email/resend:
    post:
      tags: [auth]
      summary: Renvoyer un code de vérification
      description: |
        Répond toujours 202, que l'e-mail existe, soit déjà vérifié ou non : la réponse ne révèle rien.
        Au plus 1 envoi par minute et 5 par heure pour un même e-mail (au-delà, rien n'est envoyé,
        toujours 202). Un nouveau code annule le précédent.
      operationId: resendEmailCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendEmailCodeRequest" }
      responses:
        "202": { description: Demande prise en compte }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Renouveler le jeton d'accès
      description: Le jeton de renouvellement est à usage unique et révocable ; un jeton révoqué ou expiré renvoie 401.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Nouvelle paire de jetons
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /.well-known/jwks.json:
    get:
      tags: [keys]
      summary: Clé publique de signature des jetons (JWKS)
      description: |
        Utilisée par la passerelle et par chaque service pour vérifier les JWT (RS256),
        sans jamais connaître la clé privée, qui reste dans identity-service (ADR-013).
        Ne contient que des clés publiques. Chemin standard, hors du préfixe /api/v1 :
        appelé à l'intérieur du cluster, la passerelle ne l'expose pas.
      operationId: getJwks
      security: []
      x-internal: true
      responses:
        "200":
          description: Jeu de clés publiques
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwkSet" }
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Mon profil
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [users]
      summary: Modifier mon profil
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Profil mis à jour
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthorized:
      description: Non authentifié
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: Droits insuffisants pour cette action
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: Ressource introuvable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Conflict:
      description: Conflit avec l'état actuel
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
  schemas:
    ProblemDetails:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri-reference, example: "https://teamslot.app/problems/conflict" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    PlatformRole:
      type: string
      enum: [PLAYER, VENUE_MANAGER, ADMIN]
    User:
      type: object
      required: [id, phone, displayName, platformRole]
      description: Le mot de passe n'est jamais renvoyé.
      properties:
        id: { type: string, format: uuid }
        phone: { type: string, example: "+212600000000" }
        phoneCountry: { $ref: "#/components/schemas/CountryCode" }
        phoneVerified: { type: boolean }
        email: { type: string, format: email, example: "yassir@example.com" }
        emailVerified: { type: boolean }
        birthDate: { type: string, format: date, example: "2001-04-17" }
        displayName: { type: string, example: Yassir }
        platformRole: { $ref: "#/components/schemas/PlatformRole" }
    CountryCode:
      type: string
      pattern: "^[A-Z]{2}$"
      description: Pays du numéro (ISO 3166-1 alpha-2), pour le drapeau et la vérification du numéro
      example: MA
    RegisterRequest:
      type: object
      required: [phone, password, displayName]
      description: |
        email, phoneCountry et birthDate : facultatifs pendant la migration, obligatoires à partir de SCRUM-132.
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Enregistré en minuscules ; doit être unique
        phone:
          type: string
          pattern: "^\\+[1-9][0-9]{7,14}$"
          description: Numéro au format international (E.164), composé par le front à partir de l'indicatif du pays et du numéro saisi
          example: "+212645488442"
        phoneCountry: { $ref: "#/components/schemas/CountryCode" }
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
          description: "Règles complètes vérifiées par le serveur (12 caractères minimum à partir de SCRUM-132) : voir la description de POST /auth/register"
        displayName: { type: string, minLength: 1, maxLength: 40 }
        birthDate:
          type: string
          format: date
          description: Date passée, après le 1900-01-01. Pas d'âge minimum (décision d'équipe).
          example: "2001-04-17"
    VerifyEmailRequest:
      type: object
      required: [email, code]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        code: { type: string, pattern: "^[0-9]{6}$", example: "482913" }
    ResendEmailCodeRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
          description: |
            JWT signé en RS256 (ADR-013). Claims : sub = identifiant de l'utilisateur,
            iss = teamslot-identity, iat, exp (15 minutes). À envoyer dans l'en-tête
            Authorization: Bearer <jeton>.
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Durée de validité du jeton d'accès en secondes, example: 900 }
    Jwk:
      type: object
      description: Clé publique RSA au format JWK (RFC 7517)
      required: [kty, kid, n, e]
      properties:
        kty: { type: string, example: RSA }
        kid: { type: string, description: "Identifiant de la clé, repris dans l'en-tête des jetons" }
        use: { type: string, example: sig }
        alg: { type: string, example: RS256 }
        n: { type: string, description: Module RSA (Base64url) }
        e: { type: string, description: Exposant RSA (Base64url), example: AQAB }
    JwkSet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/Jwk" }
    UpdateUserRequest:
      type: object
      properties:
        displayName: { type: string, minLength: 1, maxLength: 40 }
