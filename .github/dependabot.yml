# Dependabot — mises à jour automatiques des dépendances (SCRUM-18)
# Chaque semaine, Dependabot ouvre une pull request quand une dépendance
# a une nouvelle version ou une faille connue.
version: 2
updates:
  # Java (Maven) : la passerelle, le parent racine (versions et correctifs communs, ADR-015),
  # les modules partagés libs/ et tous les services de services/
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/libs/*"
      - "/gateway"
      - "/services/*"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # libs/* et services/* héritent du pom racine (ADR-015) : sans regroupement, une même version
    # (ex. lz4-java, forcée dans le pom racine) ouvrait une PR par dossier, toutes identiques
    # (8 PR le 15/11, et autant de CI qui encombraient les runners). Avec un groupe, Dependabot ouvre
    # UNE seule PR pour tous les dossiers. Les montées majeures restent à part (à relire de près).
    groups:
      maven-mineures-et-correctifs:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      maven-majeures:
        patterns: ["*"]
        update-types: ["major"]

  # npm : le front React
  - package-ecosystem: "npm"
    directories:
      - "/frontend/apps/web"
      - "/frontend/packages/shared"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"

  # Images de base des Dockerfile
  - package-ecosystem: "docker"
    directories:
      - "/gateway"
      - "/services/*"
      - "/frontend/apps/web"
      # SCRUM-129 : image du scan ZAP (fichier .zap/Dockerfile, utilisé par zap-staging.yml)
      - "/.zap"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    # L'équipe a choisi Java 21 (Sprint 0) : pas de changement de version de Java automatique
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      # Tag "3.9-eclipse-temurin-21" : contient la version de Java, image de build seulement
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]

  # Actions utilisées par la CI (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
