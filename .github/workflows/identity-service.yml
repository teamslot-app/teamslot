name: identity-service
on:
  pull_request:
    paths:
      - 'services/identity-service/**'
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.dockerignore'
      - '.github/workflows/java-service.yml'
      - '.github/workflows/identity-service.yml'
  push:
    branches: [main]
    # Build Maven unique (ADR-015) : un changement des modules ou du parent reconstruit et redéploie le service
    paths:
      - 'services/identity-service/**'
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  ci:
    uses: ./.github/workflows/java-service.yml
    with:
      service: services/identity-service
      name: identity-service
      sonar_project_key: teamslot-app_identity-service
      racine: true
    secrets: inherit
