name: service-template
on:
  pull_request:
    paths:
      - 'services/service-template/**'
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.dockerignore'
      - '.github/workflows/java-service.yml'
      - '.github/workflows/service-template.yml'
  push:
    branches: [main]
    # Build Maven unique (ADR-015) : un changement des modules ou du parent reconstruit et redéploie le service
    paths:
      - 'services/service-template/**'
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  ci:
    uses: ./.github/workflows/java-service.yml
    with:
      service: services/service-template
      name: service-template
      sonar_project_key: teamslot-app_teamslot
      racine: true
    secrets: inherit
