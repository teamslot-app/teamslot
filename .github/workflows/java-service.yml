name: java-service
on:
  workflow_call:
    inputs:
      service:
        description: "Dossier du service (contient pom.xml et mvnw), ex. services/service-template"
        required: true
        type: string
      name:
        description: "Nom court du service, ex. service-template"
        required: true
        type: string
      sonar_project_key:
        description: "Clé du projet SonarCloud ; vide = pas d'analyse Sonar"
        required: false
        type: string
        default: ''

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service }}/pom.xml

      - name: Build et tests
        run: ./mvnw -B verify

      - name: Analyse SonarCloud
        if: inputs.sonar_project_key != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=teamslot-app
          -Dsonar.projectKey=${{ inputs.sonar_project_key }}
          -Dsonar.qualitygate.wait=true
