name: java-service
on:
  workflow_call:
    inputs:
      service:
        description: "Dossier du service (contient pom.xml, mvnw et Dockerfile), ex. services/service-template"
        required: true
        type: string
      name:
        description: "Nom de l'image sur GHCR, ex. service-template"
        required: true
        type: string
      sonar_project_key:
        description: "Clé du projet SonarCloud ; vide = pas d'analyse Sonar"
        required: false
        type: string
        default: ''

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.service }}/pom.xml

      - name: Build et tests
        run: ./mvnw -B verify

      - name: Analyse SonarCloud
        if: inputs.sonar_project_key != '' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=teamslot-app
          -Dsonar.projectKey=${{ inputs.sonar_project_key }}
          -Dsonar.qualitygate.wait=true

  # SCRUM-90 : sur une PR, construire et scanner l'image sans la publier (faille vue avant la fusion)
  image-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: pr-scan/${{ inputs.name }}:${{ github.sha }}
      CONTEXTE: ${{ inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image (PR, sans publication)
        run: docker build -t "$IMAGE" "$CONTEXTE"

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  image:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image (sans la publier)
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -t "$IMAGE"
          ${{ inputs.service }}

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Connexion à GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publier l'image
        run: |
          docker push "$IMAGE"
          echo "Image publiée : $IMAGE" >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Jeton temporaire du robot (1 heure, écriture du contenu seulement)
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          # Moindre privilège (ADR-004) : le jeton ne peut qu'écrire du contenu dans ce dépôt.
          permission-contents: write

      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.bot.outputs.token }}

      - name: Mettre à jour le tag en staging
        working-directory: deploy/k8s/overlays/staging
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ inputs.name }}
          SHA: ${{ github.sha }}
        run: |
          IMG="ghcr.io/${OWNER}/${SERVICE}"
          kustomize edit set image "$IMG=$IMG:${SHA}"
          cat kustomization.yaml

      - name: Commit et push sur main
        env:
          SERVICE: ${{ inputs.name }}
          SHA: ${{ github.sha }}
          FICHIER: deploy/k8s/overlays/staging/kustomization.yaml
        run: |
          set -euo pipefail
          git config user.name "teamslot-ci-bot[bot]"
          git config user.email "teamslot-ci-bot[bot]@users.noreply.github.com"
          git add "$FICHIER"
          if git diff --cached --quiet; then
            echo "Tag déjà à jour, rien à faire."
            exit 0
          fi
          # Garde-fou (ADR-004) : le bot contourne la protection de main, il ne doit modifier que ce fichier.
          modifies=$(git diff --cached --name-only)
          if [ "$modifies" != "$FICHIER" ]; then
            echo "::error::Le bot ne doit modifier que $FICHIER. Fichiers prêts : $modifies"
            exit 1
          fi
          git commit -m "chore(deploy): staging ${SERVICE} -> ${SHA}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Staging : ${SERVICE} -> ${SHA}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push refusé, nouvel essai dans 5 s ($i/3)"
            sleep 5
          done
          echo "::error::Impossible de pousser le nouveau tag après 3 essais"
          exit 1
