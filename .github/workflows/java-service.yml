name: java-service
on:
  workflow_call:
    inputs:
      service:
        description: "Dossier du service (contient pom.xml et Dockerfile), ex. services/service-template"
        required: true
        type: string
      name:
        description: "Nom de l'image sur GHCR, ex. service-template"
        required: true
        type: string
      sonar_project_key:
        description: "Clé du projet SonarCloud ; vide = pas d'analyse Sonar"
        required: false
        type: string
        default: ''
      racine:
        description: "true = service passé au build Maven unique (ADR-015) : build depuis la racine (-pl -am), image construite avec la racine comme contexte"
        required: false
        type: boolean
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.racine && '.' || inputs.service }}
    env:
      SERVICE: ${{ inputs.service }}
      RACINE: ${{ inputs.racine }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ inputs.racine && '**/pom.xml' || format('{0}/pom.xml', inputs.service) }}

      - name: Build et tests
        run: |
          if [ "$RACINE" = "true" ]; then
            # Le service et les modules dont il dépend (libs/*). install : l'analyse Sonar ci-dessous
            # ne traite que le module du service et lit ses modules dans le dépôt Maven local.
            ./mvnw -B -pl "$SERVICE" -am install
          else
            ./mvnw -B verify
          fi

      - name: Analyse SonarCloud
        if: inputs.sonar_project_key != '' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          CLE_SONAR: ${{ inputs.sonar_project_key }}
        run: |
          # Build unique : seulement le module du service (un projet Sonar par service, ADR-015 règle 5).
          # -f et non -pl : avec -pl, le scanner refuse la session ("does not declare a top level project").
          # Les modules libs/* sont lus dans le dépôt Maven local, remplis par "install" ci-dessus.
          POM=()
          if [ "$RACINE" = "true" ]; then POM=(-f "$SERVICE/pom.xml"); fi
          ./mvnw -B "${POM[@]}" org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=teamslot-app \
            -Dsonar.projectKey="$CLE_SONAR" \
            -Dsonar.qualitygate.wait=true

      # Les modules TeamSlot installés ne doivent pas entrer dans le cache Maven partagé
      - name: Retirer les modules TeamSlot du dépôt Maven local
        if: always() && inputs.racine
        run: rm -rf ~/.m2/repository/ma/teamslot

  # SCRUM-90 : sur une PR, construire et scanner l'image sans la publier (faille vue avant la fusion)
  image-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: pr-scan/${{ inputs.name }}:${{ github.sha }}
      DOCKERFILE: ${{ inputs.service }}/Dockerfile
      CONTEXTE: ${{ inputs.racine && '.' || inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image (PR, sans publication)
        run: docker build -f "$DOCKERFILE" -t "$IMAGE" "$CONTEXTE"

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  image:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # SCRUM-104 : jeton OIDC pour signer avec cosign sans clé. Seulement dans ce job.
      id-token: write
    outputs:
      digest: ${{ steps.empreinte.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}:${{ github.sha }}
      DOCKERFILE: ${{ inputs.service }}/Dockerfile
      CONTEXTE: ${{ inputs.racine && '.' || inputs.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image (sans la publier)
        run: >
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -f "$DOCKERFILE"
          -t "$IMAGE"
          "$CONTEXTE"

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Connexion à GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publier l'image
        run: |
          docker push "$IMAGE"
          echo "Image publiée : $IMAGE" >> "$GITHUB_STEP_SUMMARY"

      # SCRUM-104 : on signe l'empreinte (@sha256:...), jamais un tag (un tag peut être déplacé).
      - name: Empreinte de l'image publiée
        id: empreinte
        run: |
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          DIGEST="${REF#*@}"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::Empreinte introuvable pour $IMAGE"; exit 1 ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Empreinte : $REF" >> "$GITHUB_STEP_SUMMARY"

      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      # Mode sans clé : GitHub donne au job une identité OIDC, Sigstore délivre un certificat de
      # quelques minutes à cette identité (ce workflow, ce dépôt, cette branche). Aucune clé à stocker.
      - name: Signer l'image (cosign sans clé)
        env:
          IMAGE_SIGNEE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}@${{ steps.empreinte.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_SIGNEE"
          echo "Image signée : $IMAGE_SIGNEE" >> "$GITHUB_STEP_SUMMARY"

      # SCRUM-105 : SBOM (liste de tous les composants de l'image : paquets Alpine + jars Java)
      - name: Produire la SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json

      # La SBOM est attachée à l'empreinte et signée par la même identité que l'image :
      # on la retrouve à partir de l'empreinte, et on sait qu'elle vient de notre CI.
      - name: Attacher la SBOM à l'image (attestation cosign)
        env:
          IMAGE_SIGNEE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}@${{ steps.empreinte.outputs.digest }}
        run: |
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE_SIGNEE"
          COMPOSANTS=$(python3 -c "import json; print(len(json.load(open('sbom.cdx.json')).get('components', [])))")
          echo "SBOM attachée : $IMAGE_SIGNEE ($COMPOSANTS composants)" >> "$GITHUB_STEP_SUMMARY"

      # Copie de secours, téléchargeable depuis la page du run (90 jours)
      - name: Conserver la SBOM comme artefact du workflow
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.name }}-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  deploy-staging:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # SCRUM-104 : lire l'image et sa signature sur GHCR
      packages: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Jeton temporaire du robot (1 heure, écriture du contenu seulement)
        id: bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_PRIVATE_KEY }}
          # Moindre privilège (ADR-004) : le jeton ne peut qu'écrire du contenu dans ce dépôt.
          permission-contents: write

      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.bot.outputs.token }}

      - name: Installer cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.0.6'

      - name: Connexion à GHCR (lecture)
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # SCRUM-104 : on ne déploie que l'empreinte signée par le workflow java-service.yml de main
      # de CE dépôt. Image non signée ou signée par une autre identité : le job échoue, rien n'est déployé.
      - name: Vérifier la signature avant le déploiement
        env:
          IMAGE_A_VERIFIER: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}@${{ needs.image.outputs.digest }}
          IDENTITE: https://github.com/teamslot-app/teamslot/.github/workflows/java-service.yml@refs/heads/main
          EMETTEUR: https://token.actions.githubusercontent.com
        run: |
          case "$IMAGE_A_VERIFIER" in
            *@sha256:*) ;;
            *) echo "::error::Empreinte de l'image absente : déploiement refusé"; exit 1 ;;
          esac
          cosign verify --certificate-oidc-issuer "$EMETTEUR" --certificate-identity "$IDENTITE" \
            "$IMAGE_A_VERIFIER" > /dev/null
          echo "Signature vérifiée : $IMAGE_A_VERIFIER" >> "$GITHUB_STEP_SUMMARY"
          # SCRUM-105 : pas de déploiement sans SBOM signée par la même identité
          cosign verify-attestation --type cyclonedx \
            --certificate-oidc-issuer "$EMETTEUR" --certificate-identity "$IDENTITE" \
            "$IMAGE_A_VERIFIER" > /dev/null
          echo "SBOM vérifiée : $IMAGE_A_VERIFIER" >> "$GITHUB_STEP_SUMMARY"

      - name: Mettre à jour le tag en staging
        working-directory: deploy/k8s/overlays/staging
        env:
          OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ inputs.name }}
          SHA: ${{ github.sha }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          IMG="ghcr.io/${OWNER}/${SERVICE}"
          # Tag (lisible : SHA du commit) + empreinte vérifiée : Kubernetes tire exactement l'image vérifiée.
          kustomize edit set image "$IMG=$IMG:${SHA}@${DIGEST}"
          cat kustomization.yaml

      - name: Commit et push sur main
        env:
          SERVICE: ${{ inputs.name }}
          SHA: ${{ github.sha }}
          FICHIER: deploy/k8s/overlays/staging/kustomization.yaml
        run: |
          set -euo pipefail
          git config user.name "teamslot-ci-bot[bot]"
          git config user.email "teamslot-ci-bot[bot]@users.noreply.github.com"
          git add "$FICHIER"
          if git diff --cached --quiet; then
            echo "Tag déjà à jour, rien à faire."
            exit 0
          fi
          # Garde-fou (ADR-004) : le bot contourne la protection de main, il ne doit modifier que ce fichier.
          modifies=$(git diff --cached --name-only)
          if [ "$modifies" != "$FICHIER" ]; then
            echo "::error::Le bot ne doit modifier que $FICHIER. Fichiers prêts : $modifies"
            exit 1
          fi
          git commit -m "chore(deploy): staging ${SERVICE} -> ${SHA}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Staging : ${SERVICE} -> ${SHA}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Push refusé, nouvel essai dans 5 s ($i/3)"
            sleep 5
          done
          echo "::error::Impossible de pousser le nouveau tag après 3 essais"
          exit 1
