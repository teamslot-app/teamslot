name: libs
# Modules partagés (ADR-015, SCRUM-88) : testés et analysés une seule fois, ici.
# Les services qui en dépendent sont reconstruits par leur propre workflow (chemins libs/** et pom.xml).
on:
  pull_request:
    paths:
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.github/workflows/libs.yml'
  push:
    branches: [main]
    paths:
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Liste des modules, séparés par des virgules (ex. libs/events,libs/web)
      MODULES: libs/events
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Build et tests des modules
        run: ./mvnw -B -pl "$MODULES" -am verify

      - name: Analyse SonarCloud
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -pl "$MODULES" org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=teamslot-app
          -Dsonar.projectKey=teamslot-app_libs
          -Dsonar.qualitygate.wait=true
