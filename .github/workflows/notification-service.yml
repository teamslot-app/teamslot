name: notification-service
# SCRUM-128 : même chaîne que les autres services via java-service.yml (build, tests, Sonar, Trivy,
# image signée cosign, SBOM attestée, vérification puis déploiement en staging).
on:
  pull_request:
    paths:
      - 'services/notification-service/**'
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.dockerignore'
      - '.github/workflows/java-service.yml'
      - '.github/workflows/notification-service.yml'
  push:
    branches: [main]
    # Build Maven unique (ADR-015) : un changement des modules ou du parent reconstruit et redéploie le service
    paths:
      - 'services/notification-service/**'
      - 'libs/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - '.dockerignore'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  # SCRUM-104 : plafond nécessaire pour que java-service.yml signe avec cosign sans clé.
  # Un workflow appelé ne peut pas dépasser les permissions de l'appelant ; dans java-service.yml,
  # seul le job « image » demande id-token: write.
  id-token: write
jobs:
  ci:
    uses: ./.github/workflows/java-service.yml
    with:
      service: services/notification-service
      name: notification-service
      sonar_project_key: teamslot-app_notification-service
      racine: true
    secrets: inherit
