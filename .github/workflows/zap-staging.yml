name: zap-staging
# SCRUM-72 : scan OWASP ZAP passif du staging. SCRUM-129 : authentifié (compte de test dédié),
# AJAX spider pour le front React, ZAP 2.17.0 épinglé et suivi par Dependabot (.zap/Dockerfile).
# Déclenché chaque soir et à la main, jamais sur une PR : impossible à lancer depuis un fork,
# et les secrets (Tailscale, compte de test) ne sont disponibles que sur la branche par défaut.
on:
  schedule:
    # Tous les jours à 19 h 47 UTC (20 h 47 au Maroc) : à caler sur les créneaux d'allumage de docs/cluster.md
    - cron: '47 19 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zap-staging
  cancel-in-progress: false
env:
  # Cible fixe : le staging uniquement (PC d'Amira, HTTPS par Tailscale, SCRUM-34). Jamais la production.
  # Le front (Ingress /) et la passerelle (Ingress /api) sont derrière la même adresse.
  STAGING: https://amira.tail764250.ts.net:8443
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Le runner rejoint le réseau Tailscale avec l'étiquette tag:ci. L'ACL n'autorise tag:ci
      # que vers le PC d'Amira, port 8443. Client OAuth créé par Amira, valeurs dans les secrets GitHub.
      - name: Rejoindre le réseau Tailscale (tag:ci)
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Le staging tourne sur un PC qui n'est pas toujours allumé : s'il ne répond pas,
      # on le signale sans faire échouer le job (pas une faille, juste pas de scan ce soir).
      # Plusieurs essais espacés : un nœud qui vient de rejoindre Tailscale n'est pas joignable tout de suite.
      # Pas d'adresse IP dans les logs : seulement le nom de la cible et le code HTTP.
      - name: Le staging répond-il ?
        id: joignable
        run: |
          CODE=000
          for essai in 1 2 3 4 5 6; do
            CODE=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' "$STAGING/api/v1/template/version" 2>/dev/null || true)
            echo "Essai $essai : HTTP $CODE"
            [ "$CODE" != "000" ] && break
            sleep 10
          done
          if [ "$CODE" = "000" ]; then
            echo "::warning::Staging injoignable : PC d'Amira éteint, cluster arrêté ou ACL Tailscale (port 8443). Scan non effectué."
            echo "Staging injoignable : scan non effectué." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "Staging joignable (HTTP $CODE)"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Compte DÉDIÉ au scan (créé au premier passage), identifiants dans les secrets GitHub.
      # Le jeton est masqué dans les logs et gardé dans un fichier temporaire du runner (droits 600).
      - name: Compte de test du scan (connexion)
        if: steps.joignable.outputs.ok == 'true'
        env:
          TELEPHONE: ${{ secrets.ZAP_TEST_PHONE }}
          MOT_DE_PASSE: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: python3 .zap/compte_test.py "$STAGING" "$RUNNER_TEMP"

      # Routes GET des contrats docs/api (aucune écriture) et plan ZAP. Avant le scan, on vérifie
      # que les routes protégées répondent bien 200 avec le jeton : sinon le scan ne verrait que des 401.
      - name: Routes GET et plan du scan
        if: steps.joignable.outputs.ok == 'true'
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod 777 zap
          python3 .zap/plan.py "$STAGING" zap
          protegees_200=0
          echo "| Route GET | Accès | Code avec le jeton du compte de test |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while IFS="$(printf '\t')" read -r url acces; do
            code=$(curl -sS -o /dev/null -m 15 -w '%{http_code}' -H @"$RUNNER_TEMP/zap-entete" "$url" 2>/dev/null || true)
            chemin=${url#"$STAGING"}
            echo "  GET $chemin ($acces) -> $code"
            echo "| \`$chemin\` | $acces | $code |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$acces" = protegee ] && [ "$code" = 200 ]; then protegees_200=$((protegees_200 + 1)); fi
          done < zap/routes.tsv
          if [ "$protegees_200" -eq 0 ]; then
            echo "::error::Aucune route protégée ne répond 200 avec le jeton : le scan ne serait pas authentifié."
            exit 1
          fi
          echo "$protegees_200 route(s) protégée(s) en 200 avec le jeton du compte de test."

      # Image épinglée par version et empreinte dans .zap/Dockerfile (Dependabot la tient à jour).
      # Scan PASSIF : ZAP lit les réponses, n'envoie aucune attaque et seulement des GET (plan.py).
      # Le jeton est passé par variable d'environnement (-e sans valeur : il n'apparaît pas dans la
      # ligne de commande), et ZAP ne l'ajoute qu'aux requêtes vers le staging (ZAP_AUTH_HEADER_SITE).
      - name: Scan ZAP authentifié (passif, GET seulement, AJAX spider)
        if: steps.joignable.outputs.ok == 'true'
        run: |
          docker build -q -t zap-teamslot .zap
          ZAP_AUTH_HEADER_VALUE=$(sed -n 's/^Authorization: //p' "$RUNNER_TEMP/zap-entete")
          ZAP_AUTH_HEADER_SITE=$(echo "$STAGING" | sed -E 's#^https?://([^:/]+).*#\1#')
          export ZAP_AUTH_HEADER_VALUE ZAP_AUTH_HEADER_SITE
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER_VALUE -e ZAP_AUTH_HEADER_SITE \
            zap-teamslot zap.sh -cmd -autorun /zap/wrk/plan.json

      # Le rapport sera publié en artefact : il ne doit contenir ni le jeton ni le mot de passe.
      # Toujours exécutée (même si le scan a échoué après avoir écrit un rapport) : seul un rapport
      # vérifié ici est publié (condition de l'étape « Conserver le rapport »).
      - name: Aucun secret dans le rapport
        id: verification
        if: always() && steps.joignable.outputs.ok == 'true'
        env:
          MOT_DE_PASSE: ${{ secrets.ZAP_TEST_PASSWORD }}
        run: |
          jeton=$(sed -n 's/^Authorization: Bearer //p' "$RUNNER_TEMP/zap-entete" 2>/dev/null || true)
          fuite=0
          for f in zap/rapport.html zap/rapport.json zap/rapport.md; do
            [ -f "$f" ] || continue
            for secret in "$jeton" "$MOT_DE_PASSE"; do
              if [ -n "$secret" ] && grep -qF -- "$secret" "$f"; then
                echo "::error::Secret trouvé dans $f : rapport non publié."
                fuite=1
              fi
            done
          done
          if [ "$fuite" -ne 0 ]; then
            rm -f zap/rapport.*
            exit 1
          fi
          echo "Rapport vérifié : ni jeton ni mot de passe."

      # Une alerte de niveau élevé (riskcode 3) non acceptée dans .zap/rules.tsv fait échouer le job.
      - name: Alertes de niveau élevé
        if: steps.joignable.outputs.ok == 'true'
        run: |
          cat zap/rapport.md >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          import json, sys
          ignorees = set()
          for ligne in open(".zap/rules.tsv", encoding="utf-8"):
              if ligne.strip() and not ligne.startswith("#"):
                  champs = ligne.rstrip("\n").split("\t")
                  if len(champs) >= 2 and champs[1].strip() == "IGNORE":
                      ignorees.add(champs[0].strip())
          rapport = json.load(open("zap/rapport.json", encoding="utf-8"))
          hautes = [a for site in rapport.get("site", []) for a in site.get("alerts", [])
                    if str(a.get("riskcode")) == "3" and str(a.get("pluginid")) not in ignorees]
          for a in hautes:
              print(f"::error::ZAP, alerte élevée : {a.get('name')} (règle {a.get('pluginid')})")
          print(f"{len(hautes)} alerte(s) de niveau élevé non acceptée(s).")
          sys.exit(1 if hautes else 0)
          PY

      - name: Conserver le rapport
        if: always() && steps.verification.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: zap-rapport-${{ github.run_number }}
          path: |
            zap/rapport.html
            zap/rapport.json
            zap/rapport.md
          if-no-files-found: ignore
          retention-days: 30

      # Le jeton ne survit pas au job (le runner est jetable, mais on ne compte pas dessus).
      - name: Effacer le jeton
        if: always()
        run: rm -f "$RUNNER_TEMP/zap-entete"
