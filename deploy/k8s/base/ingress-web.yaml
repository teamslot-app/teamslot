# Le front (/) ; l'Ingress de /api (SCRUM-72, Sara) est séparé : Traefik les combine, la règle la plus
# spécifique gagne. Les appels /api du navigateur passent de toute façon par nginx (API_UPSTREAM).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  labels:
    app: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
