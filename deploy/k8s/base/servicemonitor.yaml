# SCRUM-73 : Prometheus collecte /actuator/prometheus de tous les services
# (avant : service-template seulement). Le label "job" de chaque série = nom du Service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: teamslot-services
  labels:
    release: monitoring
spec:
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - gateway
          - identity-service
          - venue-service
          - match-service
          - payment-service
          - service-template
          - notification-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
