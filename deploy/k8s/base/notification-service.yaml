# notification-service (SCRUM-128) : même modèle que payment-service (non-root, rootfs en lecture seule,
# capacités retirées, seccomp RuntimeDefault : compatible Pod Security « restricted »).
# Base « notification » dans l'instance PostgreSQL existante (ADR-017) ; identifiants : SealedSecret notification-db.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        # Un Secret lu en variables d'environnement n'est relu qu'au démarrage du pod. Changer cette valeur
        # (par PR) redémarre notification-service par GitOps, sans action manuelle dans le cluster.
        # A modifier à chaque création ou rotation du secret notification-smtp (docs/email-staging.md).
        teamslot.ma/notification-smtp: "2026-11-22"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-service
          image: ghcr.io/teamslot-app/notification-service
          ports:
            - name: http
              containerPort: 8086
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/notification"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-db
                  key: DB_PASSWORD
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: JWT_JWK_SET_URI
              value: "http://identity-service/.well-known/jwks.json"
            # SCRUM-134 : relais SMTP (Brevo en staging). Tout vient du secret notification-smtp, facultatif :
            # sans ce secret, SMTP_HOST est vide et l'envoi d'e-mails reste désactivé (aucune erreur au démarrage).
            # Création du secret : docs/email-staging.md. Jamais de valeur en clair dans le dépôt.
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: SMTP_PASSWORD
                  optional: true
            - name: EMAIL_EXPEDITEUR
              valueFrom:
                secretKeyRef:
                  name: notification-smtp
                  key: EMAIL_EXPEDITEUR
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Squelette sans métier (SCRUM-128) : moins que payment, pour la mémoire limitée du cluster (ADR-003).
          # A réévaluer avec SCRUM-81 et SCRUM-134 (consommateurs Kafka, envoi d'e-mails).
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              cpu: "1"
              memory: 640Mi
          # Sondes (remarque d'Amira, 15/11 : liveness « context deadline exceeded » ×7 en 4 min).
          # Sans timeoutSeconds, Kubernetes n'attend qu'1 s : trop court pendant le démarrage (~50 s)
          # ou une pause du ramasse-miettes. startupProbe couvre le démarrage (jusqu'à 2 min) ;
          # tant qu'elle n'a pas réussi, readiness et liveness ne sont pas appliquées.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 80
      targetPort: http
