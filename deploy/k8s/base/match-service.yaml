apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-service
  labels:
    app: match-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-service
  template:
    metadata:
      labels:
        app: match-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: match-service
          image: ghcr.io/teamslot-app/match-service
          ports:
            - name: http
              containerPort: 8082
          env:
            # SCRUM-112 (ADR-017) : base MongoDB match, utilisateur match_user (readWrite sur match seulement).
            # URI complète (mot de passe, replicaSet=rs0, authSource=match) dans le SealedSecret mongodb-auth.
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: mongodb-auth
                  key: match-uri
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: JWT_JWK_SET_URI
              value: "http://identity-service/.well-known/jwks.json"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: match-service
  labels:
    app: match-service
spec:
  selector:
    app: match-service
  ports:
    - name: http
      port: 80
      targetPort: http
