# SCRUM-125 : tout est refusé par défaut dans staging, puis une règle par flux réel.
# Les ports sont ceux des conteneurs (pas ceux des Services). Nouveau service = ajouter ses flux ici.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS pour tous les pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
# Ingress Traefik -> passerelle et front
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-traefik}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, web]}]}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {app.kubernetes.io/name: traefik}}
    ports: [{port: 8080}]
---
# Prometheus -> métriques des services Java et de la passerelle
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-prometheus}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, identity-service, venue-service, match-service, payment-service, service-template, notification-service]}]}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}
      podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
    ports: [{port: 8080}, {port: 8081}, {port: 8082}, {port: 8083}, {port: 8085}, {port: 8086}]
---
# Passerelle -> services
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-egress}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
  - to: [{podSelector: {matchLabels: {app: venue-service}}}]
    ports: [{port: 8081}]
  - to: [{podSelector: {matchLabels: {app: match-service}}}]
    ports: [{port: 8082}]
  - to: [{podSelector: {matchLabels: {app: payment-service}}}]
    ports: [{port: 8085}]
  - to: [{podSelector: {matchLabels: {app: service-template}}}]
    ports: [{port: 8081}]
---
# identity : appelé par la passerelle et les services (JWKS) ; parle à MySQL, Redis, Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: identity-service}
spec:
  podSelector: {matchLabels: {app: identity-service}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, venue-service, match-service, payment-service, service-template, notification-service]}]}
    ports: [{port: 8083}]
  egress:
  - to: [{podSelector: {matchLabels: {app: mysql}}}]
    ports: [{port: 3306}]
  - to: [{podSelector: {matchLabels: {app: redis}}}]
    ports: [{port: 6379}]
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}]
---
# venue : appelé par la passerelle et par match (réservation interne)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: venue-service}
spec:
  podSelector: {matchLabels: {app: venue-service}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, match-service]}]}
    ports: [{port: 8081}]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{port: 5432}]
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}]
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
---
# match
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: match-service}
spec:
  podSelector: {matchLabels: {app: match-service}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: gateway}}}]
    ports: [{port: 8082}]
  egress:
  - to: [{podSelector: {matchLabels: {app: venue-service}}}]
    ports: [{port: 8081}]
  - to: [{podSelector: {matchLabels: {app: mongodb}}}]
    ports: [{port: 27017}]
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}]
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
---
# payment
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: payment-service}
spec:
  podSelector: {matchLabels: {app: payment-service}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: gateway}}}]
    ports: [{port: 8085}]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{port: 5432}]
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}]
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
---
# service-template : modèle, parle seulement à PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-template}
spec:
  podSelector: {matchLabels: {app: service-template}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: gateway}}}]
    ports: [{port: 8081}]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{port: 5432}]
---
# Bases : une base n'accepte que son service
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: postgres}
spec:
  podSelector: {matchLabels: {app: postgres}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [venue-service, payment-service, service-template, notification-service]}]}
    ports: [{port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mysql}
spec:
  podSelector: {matchLabels: {app: mysql}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 3306}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis}
spec:
  podSelector: {matchLabels: {app: redis}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 6379}]
---
# MongoDB : match, le Job mongodb-init et le replica set (communication avec lui-même)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: mongodb}
spec:
  podSelector: {matchLabels: {app: mongodb}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: match-service}}
    - podSelector: {matchLabels: {job-name: mongodb-init}}
    - podSelector: {matchLabels: {app: mongodb}}
    ports: [{port: 27017}]
  egress:
  - to: [{podSelector: {matchLabels: {app: mongodb}}}]
    ports: [{port: 27017}]
---
# Kafka : les services qui publient/consomment, le Job des topics, et le broker avec lui-même
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: kafka}
spec:
  podSelector: {matchLabels: {app: kafka}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchExpressions: [{key: app, operator: In, values: [identity-service, venue-service, match-service, payment-service, kafka, notification-service]}]}
    - podSelector: {matchLabels: {job-name: kafka-topics}}
    ports: [{port: 9092}, {port: 9093}]
  egress:
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}, {port: 9093}]
---
# Jobs (hooks Argo CD)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: job-kafka-topics}
spec:
  podSelector: {matchLabels: {job-name: kafka-topics}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: job-mongodb-init}
spec:
  podSelector: {matchLabels: {job-name: mongodb-init}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: mongodb}}}]
    ports: [{port: 27017}]
---
---
# service-template valide ses JWT avec le JWKS d'identity (comme les autres services)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-template-jwks}
spec:
  podSelector: {matchLabels: {app: service-template}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
---
# Test de fumée (hook PostSync) : appelle les 7 services sur leur port de conteneur
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: job-smoke-test-egress}
spec:
  podSelector: {matchLabels: {job-name: smoke-test}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: gateway}}}]
    ports: [{port: 8080}]
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
  - to: [{podSelector: {matchExpressions: [{key: app, operator: In, values: [venue-service, service-template]}]}}]
    ports: [{port: 8081}]
  - to: [{podSelector: {matchLabels: {app: match-service}}}]
    ports: [{port: 8082}]
  - to: [{podSelector: {matchLabels: {app: payment-service}}}]
    ports: [{port: 8085}]
  - to: [{podSelector: {matchLabels: {app: notification-service}}}]
    ports: [{port: 8086}]
---
# ... et chaque service accepte ce Job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-smoke-test-ingress}
spec:
  podSelector: {matchExpressions: [{key: app, operator: In, values: [gateway, identity-service, venue-service, match-service, payment-service, service-template, notification-service]}]}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {job-name: smoke-test}}}]
    ports: [{port: 8080}, {port: 8081}, {port: 8082}, {port: 8083}, {port: 8085}, {port: 8086}]
---
# E2E (hook PostSync, SCRUM-124) : n'appelle que la passerelle, comme le front
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: job-e2e-egress}
spec:
  podSelector: {matchLabels: {job-name: e2e-parcours-match}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: gateway}}}]
    ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-e2e-ingress}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {job-name: e2e-parcours-match}}}]
    ports: [{port: 8080}]

---
# notification-service (SCRUM-128) : parle à PostgreSQL, Kafka et au JWKS d'identity ; aucune entrée depuis la passerelle
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: notification-service}
spec:
  podSelector: {matchLabels: {app: notification-service}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: postgres}}}]
    ports: [{port: 5432}]
  - to: [{podSelector: {matchLabels: {app: kafka}}}]
    ports: [{port: 9092}]
  - to: [{podSelector: {matchLabels: {app: identity-service}}}]
    ports: [{port: 8083}]
---
# SCRUM-148 : plateforme joueur (sans Ingress, testée par port-forward) -> passerelle pour /api/
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: teamslot-egress}
spec:
  podSelector: {matchLabels: {app: teamslot}}
  policyTypes: [Egress]
  egress:
  - to: [{podSelector: {matchLabels: {app: gateway}}}]
    ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-teamslot-to-gateway}
spec:
  podSelector: {matchLabels: {app: gateway}}
  policyTypes: [Ingress]
  ingress:
  - from: [{podSelector: {matchLabels: {app: teamslot}}}]
    ports: [{port: 8080}]
