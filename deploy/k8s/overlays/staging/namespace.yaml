apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    # SCRUM-126 : enforce actif après vérification (0 avertissement sur le rendu staging).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
  annotations:
    # Sécurité : si ce fichier est un jour retiré du dépôt, Argo CD ne doit pas supprimer le namespace (et tout son contenu).
    argocd.argoproj.io/sync-options: Prune=false
