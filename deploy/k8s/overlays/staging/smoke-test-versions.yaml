# SCRUM-99 : copie l'image de chaque Deployment (avec le tag écrit par la CI) dans le Job smoke-test.
# Fichier séparé : le bot de la CI réécrit kustomization.yaml (kustomize edit set image).
- source:
    kind: Deployment
    name: gateway
    fieldPath: spec.template.spec.containers.[name=gateway].image
  targets:
  - select:
      kind: Job
      name: smoke-test
    fieldPaths:
    - spec.template.spec.containers.[name=smoke].env.[name=IMAGE_GATEWAY].value
