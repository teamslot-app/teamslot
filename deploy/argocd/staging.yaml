apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamslot-staging
  namespace: argocd
  # SCRUM-113 : statut « deploy/staging » sur le commit GitHub (deploy/argocd/notifications-values.yaml)
  annotations:
    notifications.argoproj.io/subscribe.on-sync-running.github: ""
    notifications.argoproj.io/subscribe.on-deployed.github: ""
    notifications.argoproj.io/subscribe.on-sync-failed.github: ""
    notifications.argoproj.io/subscribe.on-health-degraded.github: ""
spec:
  project: default
  source:
    repoURL: https://github.com/teamslot-app/teamslot.git
    targetRevision: main
    path: deploy/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
