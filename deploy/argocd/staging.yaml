apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: teamslot-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/teamslot-app/teamslot.git
    targetRevision: main
    path: deploy/k8s/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
