# SCRUM-113 : Argo CD Notifications écrit le résultat de chaque synchronisation de teamslot-staging
# sur le commit GitHub déployé (statut « deploy/staging »).
# Argo CD est installé avec Helm : ces valeurs s'ajoutent à celles de la release, appliquées par Amira
# (namespace argocd) avec « helm upgrade … --reuse-values -f deploy/argocd/notifications-values.yaml »
# (commande exacte : docs/cd.md, « Mise en place du statut GitHub »).
# Ne contient AUCUN secret : la clé privée de l'application GitHub est dans argocd-notifications-secret,
# secret scellé (deploy/argocd/notifications-secret-sealed.yaml), référencée par $github-privateKey.
notifications:
  enabled: true
  # Le secret n'est plus créé par Helm : c'est le SealedSecret qui le fournit
  secret:
    create: false
    name: argocd-notifications-secret

  # Application GitHub « teamslot-argocd-status » : seule permission « Commit statuses : read and write »,
  # installée uniquement sur teamslot-app/teamslot. appID et installationID ne sont pas secrets.
  notifiers:
    service.github: |
      appID: "5357712"
      installationID: "172397563"
      privateKey: $github-privateKey

  # Statut posé sur le commit synchronisé par Argo CD (le commit « chore(deploy) » du bot,
  # dont le message donne le commit du service). targetURL : la doc, pas l'adresse Tailscale du cluster.
  templates:
    template.deploy-en-cours: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: pending
          label: "deploy/staging"
          targetURL: "https://github.com/teamslot-app/teamslot/blob/main/docs/cd.md"
    template.deploy-reussi: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: success
          label: "deploy/staging"
          targetURL: "https://github.com/teamslot-app/teamslot/blob/main/docs/cd.md"
    template.deploy-echoue: |
      github:
        repoURLPath: "{{.app.spec.source.repoURL}}"
        revisionPath: "{{.app.status.operationState.syncResult.revision}}"
        status:
          state: failure
          label: "deploy/staging"
          targetURL: "https://github.com/teamslot-app/teamslot/blob/main/docs/cd.md#que-faire-si-le-test-échoue"

  # Le test de fumée (SCRUM-99) est un hook PostSync : s'il échoue, l'opération passe en « Failed »,
  # donc le statut est « failure ». « success » = synchronisé, hook réussi et application en bonne santé.
  triggers:
    trigger.on-sync-running: |
      - description: Synchronisation en cours
        oncePer: app.status.operationState?.syncResult?.revision
        send: [deploy-en-cours]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
    trigger.on-deployed: |
      - description: Synchronisé, test de fumée réussi, application en bonne santé
        oncePer: app.status.operationState?.syncResult?.revision
        send: [deploy-reussi]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
    trigger.on-sync-failed: |
      - description: Synchronisation ou test de fumée en échec
        oncePer: app.status.operationState?.syncResult?.revision
        send: [deploy-echoue]
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
    trigger.on-health-degraded: |
      - description: Application dégradée après synchronisation
        oncePer: app.status.operationState?.syncResult?.revision
        send: [deploy-echoue]
        when: app.status.health.status == 'Degraded'
