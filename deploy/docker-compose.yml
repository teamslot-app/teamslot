services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: template
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d template"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  service-template:
    build: ../services/service-template
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/template
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway:
    build: ../gateway
    environment:
      TEMPLATE_URL: http://service-template:8081
    ports:
      - "8080:8080"
    depends_on:
      - service-template

  # Le front (SCRUM-30) sera ajouté ici quand son Dockerfile existera :
  # web:
  #   build: ../frontend/apps/web
  #   ports:
  #     - "3000:8080"
