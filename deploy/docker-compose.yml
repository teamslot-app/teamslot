services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pgadmin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?à définir dans deploy/.env}
      TEMPLATE_DB_PASSWORD: ${DB_PASSWORD:?à définir dans deploy/.env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?à définir dans deploy/.env}
      VENUE_DB_PASSWORD: ${VENUE_DB_PASSWORD:?à définir dans deploy/.env}
      MATCH_DB_PASSWORD: ${MATCH_DB_PASSWORD:?à définir dans deploy/.env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?à définir dans deploy/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../deploy/k8s/base/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pgadmin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./k8s/base/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    restart: "no"

  service-template:
    build: ../services/service-template
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/template
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?à définir dans deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  gateway:
    build: ../gateway
    environment:
      TEMPLATE_URL: http://service-template:8081
    ports:
      - "8080:8080"
    depends_on:
      - service-template

  web:
    build: ../frontend/apps/web
    ports:
      - "3000:8080"
    depends_on:
      - gateway

volumes:
  kafka-data:
  pgdata:
