# Tests de libs/events : vrai PostgreSQL (Testcontainers, URL jdbc:tc) ; Kafka démarré par les tests qui en ont besoin
spring.application.name=events-test
spring.datasource.url=jdbc:tc:postgresql:16-alpine:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
# Le relais est appelé à la main dans les tests
teamslot.outbox.relay.enabled=false
# Comme dans les services : un nouveau groupe lit depuis le début, confirmation du broker avant "publié"
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
