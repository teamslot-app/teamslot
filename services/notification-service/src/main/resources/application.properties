server.port=8086
spring.application.name=notification-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}

# Adresse du broker : variable KAFKA_BOOTSTRAP_SERVERS (docker-compose, Kubernetes), sinon localhost:9092 (IDE)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Consommateurs : groupe = nom du service ; un nouveau groupe lit depuis le début (aucun événement perdu)
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
# Producteur : confirmation par le broker avant de marquer un événement publié
spring.kafka.producer.acks=all
# Kafka en panne : send() abandonne apres 5 s (60 s par defaut), pour liberer vite la transaction et les verrous de l outbox
# delivery.timeout.ms doit etre >= request.timeout.ms + linger.ms, sinon Kafka refuse la configuration
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
# SCRUM-87 : vérification du JWT (ADR-013). Mêmes variables que la passerelle.
teamslot.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
teamslot.jwt.issuer=${JWT_ISSUER:teamslot-identity}

# SCRUM-134 : e-mail de vérification (code à 6 chiffres) par SMTP. Mailpit en local et en CI, relais Brevo en staging.
# Hôte vide = envoi désactivé : l'événement est consommé et ignoré (le joueur pourra redemander un code).
# Par défaut : authentification et STARTTLS obligatoires (relais réel) ; Mailpit les désactive (SMTP_AUTH, SMTP_STARTTLS).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
teamslot.notification.email.expediteur=${EMAIL_EXPEDITEUR:TeamSlot <no-reply@teamslot.app>}
# La sonde de santé ne doit pas dépendre du relais SMTP (un relais en panne ne rend pas le service indisponible)
management.health.mail.enabled=false
