server.port=8083
spring.application.name=identity-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# SCRUM-57 : jetons JWT (ADR-013)
teamslot.jwt.issuer=teamslot-identity
teamslot.jwt.access-token-ttl-seconds=900
teamslot.jwt.refresh-token-ttl-days=30
# Clé privée RSA au format PEM (PKCS#8), fournie par un secret scellé en staging.
# Vide en local et en test : une clé temporaire est générée au démarrage.
teamslot.jwt.private-key=${JWT_PRIVATE_KEY:}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=validate
# SCRUM-147 : migrations d'identity dans leur propre dossier. libs/events livre une V2 PostgreSQL dans
# db/migration : elle ne doit pas être lue ici (MySQL, et identity a déjà sa propre V2).
spring.flyway.locations=classpath:db/identity

# SCRUM-110 : refresh tokens dans Redis (ADR-017)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}

# SCRUM-147 : événements par l'outbox de libs/events, en SQL MySQL (docs/outbox-howto.md)
teamslot.events.sql=mysql
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
