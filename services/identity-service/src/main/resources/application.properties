server.port=8083
spring.application.name=identity-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true

# SCRUM-57 : jetons JWT (ADR-013)
teamslot.jwt.issuer=teamslot-identity
teamslot.jwt.access-token-ttl-seconds=900
teamslot.jwt.refresh-token-ttl-days=30
# Clé privée RSA au format PEM (PKCS#8), fournie par un secret scellé en staging.
# Vide en local et en test : une clé temporaire est générée au démarrage.
teamslot.jwt.private-key=${JWT_PRIVATE_KEY:}
