server.port=8082
spring.application.name=match-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
logging.structured.format.console=logstash
logging.structured.json.add.service=${spring.application.name}

# Adresse du broker : variable KAFKA_BOOTSTRAP_SERVERS (docker-compose, Kubernetes), sinon localhost:9092 (IDE)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Consommateurs : groupe = nom du service ; un nouveau groupe lit depuis le début (aucun événement perdu)
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
# Producteur : confirmation par le broker avant de marquer un événement publié
spring.kafka.producer.acks=all
# Kafka en panne : send() abandonne apres 5 s (60 s par defaut), pour liberer vite la transaction et les verrous de l outbox
# delivery.timeout.ms doit etre >= request.timeout.ms + linger.ms, sinon Kafka refuse la configuration
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

teamslot.venue.base-url=${VENUE_BASE_URL:http://venue-service}
