server.port=8081
spring.application.name=venue-service
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
# SCRUM-87 : vérification du JWT (ADR-013). Mêmes variables que la passerelle.
teamslot.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8083/.well-known/jwks.json}
teamslot.jwt.issuer=${JWT_ISSUER:teamslot-identity}
